[code]
editor = 'nvim'
# Optional parameter
# editor_args = ['-nw']
editor_args = []
# Optional environment variables (ex. [ "XDG_DATA_HOME=...", "XDG_CONFIG_HOME=...", "XDG_STATE_HOME=..." ])
editor_envs = []
lang = 'golang'
edit_code_marker = true
start_marker = "start_marker"
end_marker = "end_marker"
# if include problem description
comment_problem_desc = true
# comment syntax
comment_leading = "//"
test = true
inject_before = ['package solution', '']

[cookies]
csrf = ''
session = ''
site = 'leetcode.com'

[storage]
cache = 'Problems'
code = 'code'
root = '~/repos/leetcode'
scripts = 'scripts'
